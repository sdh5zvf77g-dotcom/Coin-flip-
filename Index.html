<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flipper</title>
    <!-- Google Fonts for a nice look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* CSS STYLES */
        :root {
            --primary-color: #4a90e4;
            --secondary-color: #50c878;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 30px;
        }

        /* The Coin Container */
        .coin-wrapper {
            width: 120px;
            height: 160px;
            margin: 0 auto 30px auto;
            perspective: 1000px;
        }

        .coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 2.5s cubic-bezier(0.15, 0.9, 0.34, 1);
        }

        /* The faces (Heads and Tails) */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            border: 8px solid gold; /* Gold rim */
        }

        .heads-face {
            background: white;
            color: #50c878; /* Green for heads */
        }

        .tails-face {
            background: white;
            color: #4a90e4; /* Blue for tails */
        }

        /* Flip the coin to show the other side */
        .tails-face {
            transform: rotateY(180deg);
        }

        /* Button Styling */
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background-color: #357abd;
        }

        /* Result Text */
        #result-text {
            margin: 20px 0;
            font-size: 1.4rem;
            font-weight: 600;
            min-height: 38px; /* Prevent layout jump */
            color: #555;
        }

        /* History List */
        .history-section {
            margin-top: 40px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .history-header {
            font-size: 1rem;
            color: #888;
            margin-bottom: 10px;
        }

        .history-list {
            list-style: none;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .history-list li {
            background: #f8f9fa;
            margin-bottom: 5px;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .heads { color: var(--secondary-color); font-weight: bold; }
        .tails { color: var(--primary-color); font-weight: bold; }

    </style>
</head>
<body>

    <h1>Coin Flipper</h1>
    
    <!-- The Coin -->

            <div class="face heads-face">HEADS</div>
            <div class="face tails-face">TAILS</div>
        </div>
    </div>

    <!-- Action Button -->
    <button id="flip-btn">Flip Coin</button>

    <!-- Result Output -->
    <div id="result-text"></div>

    <!-- History Section -->
    <div class="history-section">
        <div class="history-header">Recent Flips</div>
        <ul id="history-list" class="history-list">
            <!-- History items will appear here -->
        </ul>
    </div>
</div>
